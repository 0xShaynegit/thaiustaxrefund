<!DOCTYPE html>
<html class="" lang="en-US">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1, minimum-scale=1" name="viewport"/>
    <title>Page Not Found - Tax refunds for Thai citizens and companies</title>
    <meta content="The page you're looking for doesn't exist. Return to our home page to find what you need." name="description"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
            font-size: 16px;
            line-height: 1.6;
            color: #333;
            background-color: #f9f9f9;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background-color: #ffffff;
            border-bottom: 1px solid #eee;
            padding: 1.5rem 0;
        }

        .header-wrap {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .site-logo {
            font-weight: 600;
            font-size: 1.25rem;
            color: #32373c;
            text-decoration: none;
        }

        .site-logo:hover {
            color: #f76a0c;
        }

        /* Main Content */
        main {
            flex: 1;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            padding: 4rem 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .content-wrap {
            text-align: center;
        }

        .error-code {
            font-size: 6rem;
            font-weight: 700;
            color: #f76a0c;
            line-height: 1;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2.5rem;
            color: #32373c;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .error-description {
            font-size: 1.125rem;
            color: #666;
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .cta-button {
            display: inline-block;
            background-color: #32373c;
            color: #ffffff;
            text-decoration: none;
            padding: 0.75rem 2rem;
            border-radius: 9999px;
            font-size: 1rem;
            font-weight: 500;
            transition: background-color 0.3s ease, color 0.3s ease;
            border: 2px solid #32373c;
        }

        .cta-button:hover {
            background-color: #f76a0c;
            border-color: #f76a0c;
        }

        /* Footer */
        footer {
            background-color: #ffffff;
            border-top: 1px solid #eee;
            padding: 2rem;
            margin-top: auto;
        }

        .footer-wrap {
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
            color: #666;
            font-size: 0.875rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .error-code {
                font-size: 4rem;
            }

            h1 {
                font-size: 1.75rem;
            }

            .error-description {
                font-size: 1rem;
            }

            .header-wrap {
                padding: 0 1rem;
            }

            main {
                padding: 2rem 1rem;
            }

            .site-logo {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-wrap">
            <a href="/" class="site-logo">Get Tax Back</a>
        </div>
    </header>

    <main>
        <div class="content-wrap">
            <div class="error-code">404</div>
            <h1>Page Not Found</h1>
            <p class="error-description">The page you're looking for doesn't exist. It may have been moved or removed.</p>
            <a href="/" class="cta-button">Return to Home</a>
        </div>
    </main>

    <footer>
        <div class="footer-wrap">
            <p>© 2026 Tax refunds for Thai citizens and companies</p>
        </div>
    </footer>
</body>
</html>
